# Jeu d'évaluation de la compréhension. `now` est en heure de Paris.
# Par défaut : lundi 9 novembre 2026, 15:00.
seed:
  now: "2026-11-09T15:00:00"
  projects: [Inbox, Clients, Travail, Maison, Bot-test]
  tasks:
    - {content: "Devis Paul Martin", project: Clients}
    - {content: "Devis Paul (cuisine)", project: Maison}
    - {content: "Appeler maman"}
    - {content: "Rapport trimestriel", project: Travail}
    - {content: "Payer la facture EDF", project: Maison}

cases:
  # --- Création, dates relatives ------------------------------------------
  - phrase: "Rappelle-moi d'acheter du pain demain"
    expect: {type: proposal, actions: [{kind: create, content_contains: pain, due_date: "2026-11-10"}]}
  - phrase: "Ajoute envoyer la facture à Dupont jeudi"
    expect: {type: proposal, actions: [{kind: create, content_contains: Dupont, due_date: "2026-11-12"}]}
  - phrase: "Je dois rappeler le garagiste dans deux semaines"
    expect: {type: proposal, actions: [{kind: create, content_contains: garagiste, due_date: "2026-11-23"}]}
  - phrase: "Ce soir à 18 h sortir les poubelles"
    expect: {type: proposal, actions: [{kind: create, content_contains: poubelle, due_date: "2026-11-09"}]}
  - phrase: "Demain matin appeler le plombier"
    now: "2026-11-09T23:30:00"
    expect: {type: proposal, actions: [{kind: create, content_contains: plombier, due_date: "2026-11-10"}]}
  - phrase: "Lundi, réunion de préparation avec Sophie"
    now: "2026-11-13T10:00:00"
    expect: {type: proposal, actions: [{kind: create, content_contains: Sophie, due_date: "2026-11-16"}]}
  - phrase: "Ajoute réviser la voiture dans trois jours"
    expect: {type: proposal, actions: [{kind: create, content_contains: voiture, due_date: "2026-11-12"}]}
  - phrase: "Note de rappeler Julie le 1er décembre"
    expect: {type: proposal, actions: [{kind: create, content_contains: Julie, due_date: "2026-12-01"}]}
  - phrase: "Mardi, envoyer le colis à Lucie"
    expect: {type: proposal, actions: [{kind: create, content_contains: colis, due_date: "2026-11-10"}]}
  - phrase: "Ajoute acheter des piles"
    expect: {type: proposal, actions: [{kind: create, content_contains: piles}]}

  # --- Projet et priorité --------------------------------------------------
  - phrase: "Ajoute préparer la présentation dans le projet Travail"
    expect: {type: proposal, actions: [{kind: create, content_contains: présentation, project: Travail}]}
  - phrase: "Urgent : renouveler le passeport"
    expect: {type: proposal, actions: [{kind: create, content_contains: passeport, priority: 4}]}
  - phrase: "Important, relire le contrat Martin vendredi, projet Clients"
    expect: {type: proposal, actions: [{kind: create, content_contains: contrat, project: Clients, priority: 3, due_date: "2026-11-13"}]}
  - phrase: "Pour demain : rendre les livres à la bibliothèque, dans Maison"
    expect: {type: proposal, actions: [{kind: create, content_contains: livre, project: Maison, due_date: "2026-11-10"}]}

  # --- Multi-actions -------------------------------------------------------
  - phrase: "Je dois faire les courses demain et appeler la banque jeudi"
    expect: {type: proposal, actions: [
      {kind: create, content_contains: course, due_date: "2026-11-10"},
      {kind: create, content_contains: banque, due_date: "2026-11-12"}]}
  - phrase: "Ajoute trois tâches : laver la voiture, réserver le resto et acheter un cadeau"
    expect: {type: proposal, actions: [
      {kind: create, content_contains: laver}, {kind: create, content_contains: resto},
      {kind: create, content_contains: cadeau}]}
  - phrase: "Appeler maman c'est fait, et ajoute réserver le train pour Noël"
    expect: {type: proposal, actions: [
      {kind: complete, task: "Appeler maman"}, {kind: create, content_contains: train}]}

  # --- Tâches existantes ---------------------------------------------------
  - phrase: "J'ai appelé maman"
    expect: {type: proposal, actions: [{kind: complete, task: "Appeler maman"}]}
  - phrase: "Le rapport trimestriel est terminé"
    expect: {type: proposal, actions: [{kind: complete, task: "Rapport trimestriel"}]}
  - phrase: "Décale le rapport trimestriel à vendredi"
    expect: {type: proposal, actions: [{kind: update, task: "Rapport trimestriel", due_date: "2026-11-13"}]}
  - phrase: "Mets la facture EDF en urgent"
    expect: {type: proposal, actions: [{kind: update, task: "Payer la facture EDF", priority: 4}]}
  - phrase: "Supprime la tâche facture EDF"
    expect: {type: proposal, actions: [{kind: delete, task: "Payer la facture EDF"}]}
  - phrase: "Renomme appeler maman en appeler maman pour son anniversaire"
    expect: {type: proposal, actions: [{kind: update, task: "Appeler maman", content_contains: anniversaire}]}
  - phrase: "Le devis Paul Martin est envoyé"
    expect: {type: proposal, actions: [{kind: complete, task: "Devis Paul Martin"}]}

  # --- Ambiguïtés ----------------------------------------------------------
  - phrase: "Le devis Paul c'est fait"
    expect: {type: clarification}
  - phrase: "Décale le devis Paul à demain"
    expect: {type: clarification}

  # --- Questions -----------------------------------------------------------
  - phrase: "Qu'est-ce que j'ai aujourd'hui ?"
    expect: {type: answer}
  - phrase: "Quelles tâches sont en retard ?"
    expect: {type: answer}
  - phrase: "Où en est le rapport trimestriel ?"
    expect: {type: answer}

  # --- Hors sujet (refus poli) ---------------------------------------------
  - phrase: "Quelle est la capitale de l'Australie ?"
    expect: {type: answer}
  - phrase: "Écris-moi un poème sur l'automne"
    expect: {type: answer}
